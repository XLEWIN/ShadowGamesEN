name: CI

on:
  push:
  pull_request:

jobs:
  webapp:
    name: Webapp tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp-src/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  tgcloud:
    name: tgcloud module syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check all tgcloud modules
        run: find tgcloud -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Backend unit tests
        run: node --test tests_js/*.test.js
